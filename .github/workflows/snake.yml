name: generate snake animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Renders into dist/. Colours are URL parameters on each output filename,
      # and the '#' of a hex colour must be percent-encoded as %23 -- an
      # unescaped '#' starts a URL fragment, so every parameter after it is
      # dropped and the grid falls back to a colourless black-and-white render.
      #
      # color_dots is: empty cell, then the four contribution levels.
      - name: generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23A52F72&color_dots=%23F7D6EA,%23E9A8CC,%23D77BAD,%23C2428F,%23A52F72
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23E9A8CC&color_dots=%23161B22,%23301A29,%236B2B50,%23A83E78,%23C2428F

      # snk only writes files into the workspace; without this step nothing
      # reaches the `output` branch the README reads from, and the profile
      # keeps serving whatever stale SVG was published last.
      - name: push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
